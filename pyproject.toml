[project]
name = "genai-agents-course"
version = "0.1.0"
description = "GenAI · Agentic AI · AI Agents — course repo (Ajit Byru)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.60,<2",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.7,<3",
    "pytest>=8.2,<9",
    "jupyter>=1.1,<2",
    "tiktoken>=0.11,<1",
    "numpy>=2.0,<3",
    "matplotlib>=3.9,<4",
    "httpx>=0.27,<1",
    "langchain==1.4.7",              # S21+: pinned - LangChain APIs change between releases
    "langchain-openai==1.1.9",       # newest that works with openai<2 (S9-S20 are tested on openai 1.x)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
