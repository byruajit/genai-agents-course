[project]
name = "shopassist-mp1"
version = "0.1.0"
description = "Mini-Project 1: ShopAssist - order support for an online store (FastAPI + SSE + LangChain), behind a LiteLLM gateway, in Docker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "langchain-core==1.7.3",
    "langchain-openai==1.1.9",
    "openai>=1.60,<2",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",          # FastAPI's TestClient, used by eval/run_eval.py
]

[tool.uv]
package = false
