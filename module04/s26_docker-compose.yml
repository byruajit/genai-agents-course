# Session 26 - two production vector databases on your laptop.
#   docker compose -f module04/s26_docker-compose.yml pull        # PRE-WORK at home: downloads ~250 MB once
#   docker compose -f module04/s26_docker-compose.yml up -d       # start both
#   docker compose -f module04/s26_docker-compose.yml ps          # are they running?
#   docker compose -f module04/s26_docker-compose.yml down        # stop (data is kept in volumes)
# Qdrant dashboard: http://localhost:6333/dashboard
# Postgres is on host port 5433 (not 5432) so it never clashes with a PostgreSQL you installed earlier.
# The password below is for this local lab only - never reuse it anywhere real.
name: s26
services:
  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course
      POSTGRES_DB: vectors
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course -d vectors"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  qdrant-data:
  pg-data:
